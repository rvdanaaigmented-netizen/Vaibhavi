<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>For You</title>
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background particles (petals/light dust) -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Top controls: theme + discreet nav -->
  <header class="top-bar">
    <nav class="section-nav" aria-label="Book sections">
      <button data-jump="cover" class="nav-link active">Cover</button>
      <button data-jump="story" class="nav-link">Story</button>
      <button data-jump="memories" class="nav-link">Memories</button>
      <button data-jump="feelings" class="nav-link">Feelings</button>
      <button data-jump="letter" class="nav-link">Letter</button>
      <button data-jump="final" class="nav-link">Question</button>
    </nav>
    <div class="controls">
      <button id="music-toggle" class="icon-btn" aria-pressed="false" aria-label="Play soft music">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button data-theme="light" class="icon-btn theme-btn" aria-label="Light theme">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>
        </button>
        <button data-theme="dark" class="icon-btn theme-btn" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
        </button>
        <button data-theme="system" class="icon-btn theme-btn" aria-label="System theme">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Optional background music: add your own track path below (e.g. "music/soft-piano.mp3").
       Left empty by default so the app never depends on external audio. -->
  <audio id="bg-music" loop preload="none"></audio>

  <main id="app-main">

    <!-- ============ COVER ============ -->
    <section id="cover" class="view active" aria-label="Cover">
      <div class="cover-card">
        <p class="cover-eyebrow">for you</p>
        <h1 id="cover-title" class="cover-title"></h1>
        <p id="cover-subtitle" class="cover-subtitle"></p>
        <button id="open-heart-btn" class="primary-btn">
          <span id="cover-cta-text"></span>
        </button>
      </div>
    </section>

    <!-- ============ BOOK ============ -->
    <section id="book-view" class="view" aria-label="Our story">
      <div class="book-stage">
        <div class="book" id="book" role="group" aria-roledescription="flipbook" aria-label="Our story book">
          <!-- pages injected by app.js -->
        </div>
      </div>

      <div class="book-controls">
        <button id="prev-page" class="icon-btn nav-arrow" aria-label="Previous page">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="page-counter" class="page-counter" aria-live="polite"></span>
        <button id="next-page" class="icon-btn nav-arrow" aria-label="Next page">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

  </main>

  <!-- ============ YES OVERLAY ============ -->
  <div id="yes-overlay" class="overlay" hidden>
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>
    <div class="overlay-card">
      <p class="overlay-heading" id="yes-heading"></p>
      <p class="overlay-body" id="yes-body"></p>
      <p class="overlay-sub" id="yes-sub"></p>
      <a id="whatsapp-link" class="primary-btn" href="#" target="_blank" rel="noopener">
        <span id="yes-cta-text"></span>
      </a>
    </div>
  </div>

  <!-- ============ NO OVERLAY ============ -->
  <div id="no-overlay" class="overlay" hidden>
    <div class="overlay-card quiet">
      <p class="overlay-heading" id="no-heading"></p>
      <p class="overlay-body" id="no-body"></p>
      <button id="read-again-btn" class="secondary-btn">
        <span id="no-cta-text"></span>
      </button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
